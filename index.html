<!doctype html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="China-Laos Nostr Logistics & Tracking System">
  <title>China–Laos Nostr Logistics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Noto Sans Lao', 'ui-sans-serif', 'system-ui'] },
          colors: { ink: '#07111f', cyanx: '#22d3ee' }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -left-32 -top-32 h-96 w-96 rounded-full bg-cyan-500/10 blur-3xl"></div>
    <div class="absolute -right-32 top-1/3 h-96 w-96 rounded-full bg-blue-600/10 blur-3xl"></div>
  </div>

  <header class="sticky top-0 z-30 border-b border-white/10 bg-slate-950/80 backdrop-blur-xl">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 lg:px-6">
      <button id="brandBtn" class="flex items-center gap-3 text-left">
        <div class="grid h-10 w-10 place-items-center rounded-xl border border-cyan-300/30 bg-cyan-300/10 text-cyan-300">↯</div>
        <div>
          <div class="font-bold tracking-tight">China–Laos Nostr Logistics</div>
          <div class="text-xs text-slate-400">Decentralized shipment tracking</div>
        </div>
      </button>
      <nav class="hidden items-center gap-1 md:flex">
        <button data-view="dashboard" class="nav-btn rounded-lg px-3 py-2 text-sm text-slate-300 hover:bg-white/5">Dashboard</button>
        <button data-view="create" class="nav-btn rounded-lg px-3 py-2 text-sm text-slate-300 hover:bg-white/5">Create shipment</button>
        <button data-view="track" class="nav-btn rounded-lg px-3 py-2 text-sm text-slate-300 hover:bg-white/5">Track</button>
        <button data-view="settings" class="nav-btn rounded-lg px-3 py-2 text-sm text-slate-300 hover:bg-white/5">Settings</button>
      </nav>
      <button id="mobileMenu" class="rounded-lg border border-white/10 px-3 py-2 md:hidden">☰</button>
    </div>
    <div id="mobileNav" class="hidden border-t border-white/10 px-4 pb-3 md:hidden">
      <div class="grid grid-cols-2 gap-2 pt-3">
        <button data-view="dashboard" class="nav-btn rounded-lg bg-white/5 px-3 py-2 text-sm">Dashboard</button>
        <button data-view="create" class="nav-btn rounded-lg bg-white/5 px-3 py-2 text-sm">Create</button>
        <button data-view="track" class="nav-btn rounded-lg bg-white/5 px-3 py-2 text-sm">Track</button>
        <button data-view="settings" class="nav-btn rounded-lg bg-white/5 px-3 py-2 text-sm">Settings</button>
      </div>
    </div>
  </header>

  <main id="app" class="mx-auto max-w-7xl px-4 py-6 lg:px-6"></main>

  <div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-50 hidden -translate-x-1/2 rounded-xl border border-white/10 bg-slate-900/95 px-4 py-3 text-sm shadow-2xl"></div>

  <script type="module" src="./app.js"></script>
  <script type="module" src="./status.js"></script>
</body>
</html>
